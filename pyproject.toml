[project]
name = "zuerich-schulferien-ics"
version = "2.0.0"
description = "Subscribable iCal feed for Zurich public school holidays, generated from Open Data Zurich (CKAN)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# generate_ics.py sits at the repo root, not in a package. Without this the
# console-script `pytest` (as CI invokes it) cannot import it — only
# `python -m pytest` would work, because that alone puts the CWD on sys.path.
pythonpath = ["."]
