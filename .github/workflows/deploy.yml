name: Generate and deploy ICS feed

on:
  schedule:
    - cron: '23 2 * * *'   # nightly, off-peak minute to avoid GitHub cron congestion
  workflow_dispatch:        # manual trigger, e.g. after a new school year is published
  push:
    branches: [main]        # deploy on code changes too
    paths-ignore:
      # The keepalive heartbeat changes nothing the feed is built from, so it
      # must not cost a second build and deploy on top of the nightly one.
      - '.github/last-heartbeat'
  pull_request:
    branches: [main]        # test only — build and deploy are skipped below

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref, so a pull request run never queues behind (or ahead of) a nightly
  # deploy. Serialising the actual Pages deployment happens on the deploy job.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on offline fixtures, so a CKAN outage can never turn the suite red.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: pytest -q

  # A pull request gets the test job only: no Pages deployment from a branch,
  # and no dependency on the live CKAN API to turn a review red.
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed (fails hard on implausible data)
        run: python generate_ics.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages          # GitHub Pages allows one deployment at a time
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  # Without this, a failed nightly run is silent: the sanity gate correctly
  # leaves the last known-good feed on Pages, nothing turns red anywhere a
  # human looks, and the feed keeps serving dates that quietly stop being
  # refreshed. Pull requests are excluded — a red check is visible there.
  alert:
    needs: [test, build, deploy]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write         # job-level block replaces the workflow defaults
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Feed-Build fehlgeschlagen
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          # Match on the exact title rather than the search API: search is
          # eventually consistent, and a stale index would open a fresh issue
          # every night instead of commenting on the open one.
          number=$(curl -sSf "${auth[@]}" "${api}/issues?state=open&per_page=100" \
            | jq -r --arg t "$TITLE" \
              '[.[] | select(.pull_request == null) | select(.title == $t)] | first | .number // empty')

          body=$(printf '%s\n' \
            "Der Lauf **${GITHUB_WORKFLOW}** (\`${GITHUB_EVENT_NAME}\`) ist fehlgeschlagen." \
            "" \
            "- Lauf: ${RUN_URL}" \
            "- Commit: \`${GITHUB_SHA}\`" \
            "" \
            "Der zuletzt erfolgreich gebaute Feed wird auf GitHub Pages weiter ausgeliefert —" \
            "Abonnentinnen und Abonnenten merken zunächst nichts. Er altert aber ab jetzt." \
            "" \
            "Häufigste Ursachen: die Quelle hat die Schreibweise ihrer Titel geändert," \
            "der Datensatz reicht weniger als 180 Tage voraus, oder die CKAN-API war nicht erreichbar." \
            "Mit \`python scripts/compare_official_ics.py\` lässt sich gegen die offiziellen" \
            ".ics-Dateien der Stadt prüfen, welche der beiden Quellen abweicht." \
            "" \
            "Dieses Issue schliessen, sobald ein Lauf wieder grün ist.")

          if [ -n "$number" ]; then
            jq -n --arg b "$body" '{body: $b}' \
              | curl -sSf "${auth[@]}" -X POST -d @- "${api}/issues/${number}/comments" > /dev/null
            echo "Kommentar an bestehendem Issue #${number} ergänzt."
          else
            jq -n --arg t "$TITLE" --arg b "$body" '{title: $t, body: $b}' \
              | curl -sSf "${auth[@]}" -X POST -d @- "${api}/issues" \
              | jq -r '"Issue #\(.number) eröffnet: \(.html_url)"'
          fi
