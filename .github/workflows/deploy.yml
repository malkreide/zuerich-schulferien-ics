name: Generate and deploy ICS feed

on:
  schedule:
    - cron: '23 2 * * *'   # nightly, off-peak minute to avoid GitHub cron congestion
  workflow_dispatch:        # manual trigger, e.g. after a new school year is published
  push:
    branches: [main]        # deploy on code changes too

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed (fails hard on implausible data)
        run: python generate_ics.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
